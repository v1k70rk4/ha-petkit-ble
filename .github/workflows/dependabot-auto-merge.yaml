name: Dependabot auto-merge

# pull_request_target gives Dependabot PRs a token that can approve and merge.
# The PR's code is never checked out or run here.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3

      # Only proven minor or patch updates are merged automatically. A major or
      # unclassified update anywhere in a group leaves the PR for manual review.
      - name: Approve and enable auto-merge for minor and patch updates
        env:
          DEPS: ${{ steps.metadata.outputs.updated-dependencies-json }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if jq -e 'length > 0 and all(.[]; .updateType == "version-update:semver-minor" or .updateType == "version-update:semver-patch")' <<<"$DEPS" >/dev/null; then
            gh pr review --approve "$PR_URL"
            gh pr merge --auto --squash "$PR_URL"
          else
            echo "Not every update is a minor or patch update; leaving for manual review."
          fi
