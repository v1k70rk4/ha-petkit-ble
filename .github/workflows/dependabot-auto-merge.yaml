name: Dependabot auto-merge

# pull_request_target gives Dependabot PRs a token that can approve and merge.
# The PR's code is never checked out or run here.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        continue-on-error: true
        uses: dependabot/fetch-metadata@v3

      # Only a single-commit PR whose every update is a proven minor or patch
      # update is approved and auto-merged, both pinned to the validated head
      # commit. fetch-metadata only inspects the first commit, so anything else
      # (extra commits, failed metadata) turns auto-merge off for manual review.
      - name: Approve and enable auto-merge for minor and patch updates
        env:
          METADATA: ${{ steps.metadata.outcome }}
          DEPS: ${{ steps.metadata.outputs.updated-dependencies-json }}
          COMMITS: ${{ github.event.pull_request.commits }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$METADATA" = "success" ] && [ "$COMMITS" = "1" ] && jq -e 'length > 0 and all(.[]; .updateType == "version-update:semver-minor" or .updateType == "version-update:semver-patch")' <<<"$DEPS" >/dev/null; then
            gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" -f commit_id="$HEAD_SHA" -f event=APPROVE >/dev/null
            gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
          else
            echo "Not a validated single-commit minor or patch update; leaving for manual review."
            gh pr merge --disable-auto "$PR_URL" || true
          fi
