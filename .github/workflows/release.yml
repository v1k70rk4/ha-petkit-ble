name: Release

# One workflow per version tag. It never pushes to main and never rewrites a
# release that already exists, so hand-written release notes stay as they are.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate tag
        id: tag
        # The tag name is only ever read from the environment, never
        # interpolated into the script, and must be a plain version.
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Refusing to release from an unexpected tag name"
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tag
        uses: actions/checkout@v7

      - name: Check manifest version matches the tag
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          MANIFEST_VERSION=$(jq -r .version custom_components/petkit_ble/manifest.json)
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "::error::manifest.json version is $MANIFEST_VERSION but the tag is v$VERSION. Bump the manifest (release.sh does it) before tagging."
            exit 1
          fi

      - name: Create release if it does not exist yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it untouched."
            exit 0
          fi
          FLAGS=(--verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease --latest=false)
          fi
          if ! gh release create "$GITHUB_REF_NAME" "${FLAGS[@]}"; then
            # Someone may have created it by hand in the meantime; that is the
            # intended end state. Any other failure still fails the job.
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              echo "Release $GITHUB_REF_NAME was created concurrently; leaving it untouched."
              exit 0
            fi
            exit 1
          fi
